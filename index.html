<style>
:root{--g:#1b7b4a;--gd:#0f4f30;--gl:#d9f0e2;--ink:#12261b;--mut:#4d6357;--glass:rgba(255,255,255,.55);--bd:rgba(255,255,255,.85);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-behavior:smooth;scroll-padding-top:90px}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:#eef7f1;line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 500px at 8% 10%,#8fd5ab,transparent 70%),radial-gradient(700px 600px at 95% 30%,#bfe8cf,transparent 70%),radial-gradient(600px 500px at 40% 100%,#7cc79a,transparent 70%),#eef7f1}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--bd);box-shadow:0 8px 32px rgba(27,123,74,.12),inset 0 1px 0 rgba(255,255,255,.9);border-radius:22px}
a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
i[data-lucide],svg.lucide{width:1.15em;height:1.15em;vertical-align:-.2em}
/* banner */
#lb{position:sticky;top:0;z-index:60;margin:10px auto 0;max-width:760px;width:calc(100% - 24px);padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px;border-radius:18px}
#lb[hidden]{display:none}
#lb .t{display:flex;gap:10px;align-items:center}
#lb .b{display:flex;gap:8px;align-items:center}
.btn{font:600 14px Poppins;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;background:var(--g);color:#fff;display:inline-flex;gap:8px;align-items:center;transition:transform .2s,background .2s}
.btn:hover{background:var(--gd);transform:translateY(-1px)}
.btn.o{background:rgba(255,255,255,.6);color:var(--gd);border:1px solid var(--bd)}
.btn.o:hover{background:#fff}
.btn.s{padding:7px 14px;font-size:13px}
.x{background:none;border:0;cursor:pointer;color:var(--mut);padding:4px}
:focus-visible{outline:3px solid #f1b72b;outline-offset:2px}
/* nav */
nav{position:sticky;top:64px;z-index:50;margin:12px auto 0;max-width:1120px;width:calc(100% - 24px);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-radius:999px}
#lb[hidden]+nav{top:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;color:var(--g);letter-spacing:.5px}
.logo small{display:block;font-weight:500;font-size:9px;color:var(--ink);letter-spacing:.4px;line-height:1.1}
.links{display:flex;gap:22px;font-size:14px;font-weight:500}
.links a:hover{color:var(--g)}
.act{display:flex;gap:10px;align-items:center}
.lang{display:flex;background:rgba(255,255,255,.6);border-radius:999px;padding:3px;border:1px solid var(--bd)}
.lang button{font:600 12px Poppins;border:0;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--mut)}
.lang button.on{background:var(--g);color:#fff}
/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:70px 0 50px}
.pill{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--gd)}
h1{font-size:clamp(34px,5.4vw,60px);line-height:1.1;margin:18px 0;font-weight:700;letter-spacing:-1px}
h1 span{color:var(--g)}
.lead{font-size:17px;color:var(--mut);max-width:520px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.orbit{position:relative;aspect-ratio:1;max-width:460px;margin:auto;width:100%}
.orbit svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit .c{position:absolute;padding:14px 18px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center}
.orbit .c i{color:var(--g)}
.c1{top:6%;left:0}.c2{top:42%;right:-2%}.c3{bottom:8%;left:10%}
.core{position:absolute;inset:26%;display:grid;place-content:center;text-align:center;border-radius:50%;font-weight:700;color:var(--g);font-size:15px;line-height:1.3}
.core b{font-size:34px;display:block}
@media(prefers-reduced-motion:reduce){.orbit svg{animation:none}html{scroll-behavior:auto}}
/* sections */
section{padding:56px 0}
h2{font-size:clamp(26px,3.6vw,38px);margin:0 0 10px;font-weight:700;letter-spacing:-.5px}
.sub{color:var(--mut);max-width:560px;margin:0 0 32px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:26px 10px}
.stats div{text-align:center;padding:6px}
.stats b{font-size:34px;color:var(--g);display:block;font-weight:700}
.stats span{font-size:14px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.ft{padding:26px}
.ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#2fa467,var(--gd));color:#fff;margin-bottom:16px;font-size:22px}
.ft h3,.cc h3{margin:0 0 6px;font-size:18px}
.ft p,.cc p{margin:0;color:var(--mut);font-size:14px}
.cc{padding:22px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left;font:inherit;color:inherit;transition:transform .25s}
.cc:hover{transform:translateY(-4px)}
.meta{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:auto;padding-top:10px;flex-wrap:wrap}
.tag{align-self:flex-start;background:var(--gl);color:var(--gd);font-size:12px;font-weight:600;padding:3px 12px;border-radius:999px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:s}
.st{padding:24px;position:relative}
.st::after{counter-increment:s;content:counter(s);position:absolute;top:14px;right:20px;font-size:40px;font-weight:800;color:rgba(27,123,74,.15)}
/* classroom */
.room{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;padding:18px}
.vid{aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#0c1f15;position:relative}
.vid iframe{width:100%;height:100%;border:0;display:block}
.vh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 4px 4px}
.vh h3{margin:0;font-size:20px}
.quiz{padding:20px;background:rgba(255,255,255,.5);border-radius:18px}
.opt{display:block;width:100%;text-align:left;font:500 14px Poppins;padding:12px 14px;margin-top:10px;border-radius:14px;border:1.5px solid rgba(27,123,74,.25);background:rgba(255,255,255,.7);cursor:pointer;transition:.2s}
.opt:hover{border-color:var(--g)}
.opt.ok{background:#c9efd8;border-color:var(--g)}
.opt.no{background:#fde0dc;border-color:#d1493b}
.fb{margin-top:12px;font-weight:600;min-height:24px;font-size:14px}
.ls{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px;font-size:14px}
.ls li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.5)}
.ls li.on{background:var(--gl);font-weight:600}
.faq details{padding:16px 22px;margin-bottom:10px}
.faq summary{cursor:pointer;font-weight:600}
.faq p{color:var(--mut);margin:8px 0 0;font-size:14px}
.band{padding:44px;text-align:center;background:linear-gradient(135deg,rgba(27,123,74,.9),rgba(15,79,48,.92));color:#fff;border-color:rgba(255,255,255,.3)}
.band p{opacity:.9;max-width:520px;margin:0 auto 22px}
.band .btn{background:#fff;color:var(--gd)}
footer{padding:36px 0 50px;font-size:13px;color:var(--mut);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(max-width:880px){.hero,.room{grid-template-columns:1fr}.grid,.steps{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.links{display:none}.hero{padding-top:40px}}
@media(max-width:560px){.grid,.steps{grid-template-columns:1fr}.btn.hide{display:none}.logo small{display:none}}
</style></head>
